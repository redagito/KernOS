#kernos-desktop-concept .kd-midnight .kd-top-panel { height:42px; background:#232a36; }
#kernos-desktop-concept .kd-midnight .kd-icons { left:auto; right:18px; top:68px; }
#kernos-desktop-concept .kd-midnight .kd-shortcut { color:#e4c78e; }
#kernos-desktop-concept .kd-midnight .kd-editor { left:24px; top:68px; width:61%; height:393px; }
#kernos-desktop-concept .kd-midnight .kd-console { right:122px; top:325px; width:48%; height:234px; }
#kernos-desktop-concept .kd-midnight .kd-window { border-radius:7px; box-shadow:0 12px 32px #00000045; }
#kernos-desktop-concept .kd-midnight .kd-taskbar { left:24px; right:24px; bottom:12px; border:1px solid var(--kd-border); border-radius:7px; }
#kernos-desktop-concept .kd-midnight .kd-mark { background:#e4c78e; color:#202733; }
#kernos-desktop-concept .kd-midnight .kd-wordmark { display:none; }
@media(max-width:600px) {
  #kernos-desktop-concept .kd-desktop { height:940px; padding-top:110px; }
  #kernos-desktop-concept .kd-icons, #kernos-desktop-concept .kd-clean .kd-icons { display:flex; gap:1px; left:8px; top:12px; right:8px; justify-content:space-around; }
  #kernos-desktop-concept .kd-shortcut { width:68px; font-size:12px; }
  #kernos-desktop-concept .kd-window, #kernos-desktop-concept .kd-clean .kd-window { position:relative; left:auto; right:auto; top:auto; width:calc(100% - 24px); margin:12px; min-width:0; max-width:none; resize:none; }
  #kernos-desktop-concept .kd-editor, #kernos-desktop-concept .kd-clean .kd-editor { height:390px; }
  #kernos-desktop-concept .kd-console, #kernos-desktop-concept .kd-clean .kd-console { height:275px; }
  #kernos-desktop-concept .kd-files { position:absolute; left:0; top:150px; height:280px; }
  #kernos-desktop-concept .kd-titlebar { cursor:default; }
  #kernos-desktop-concept .kd-taskbar { gap:5px; }
  #kernos-desktop-concept .kd-taskbar button { padding:5px 8px; }
  #kernos-desktop-concept .kd-start>span:last-child, #kernos-desktop-concept .kd-tray { display:none; }
  #kernos-desktop-concept .kd-clean .kd-start-menu { left:12px; }
  #kernos-desktop-concept .kd-wordmark { bottom:75px; }
  #kernos-desktop-concept .kd-source { font-size:16px; }
  #kernos-desktop-concept .kd-workbench, #kernos-desktop-concept .kd-midnight { padding-top:148px; }
  #kernos-desktop-concept .kd-workbench .kd-icons, #kernos-desktop-concept .kd-midnight .kd-icons { top:50px; left:8px; right:8px; }
  #kernos-desktop-concept .kd-desktop .kd-window { left:auto; right:auto; top:auto; width:calc(100% - 24px); }
  #kernos-desktop-concept .kd-desktop .kd-editor { height:390px; }
  #kernos-desktop-concept .kd-desktop .kd-console { height:275px; }
  #kernos-desktop-concept .kd-desktop .kd-files { position:absolute; top:160px; left:0; }
  #kernos-desktop-concept .kd-workbench .kd-taskbar { left:0; }
  #kernos-desktop-concept .kd-midnight .kd-taskbar { left:8px; right:8px; }
  #kernos-desktop-concept .kd-workbench .kd-wordmark { display:none; }
}
</style>

<script>
(() => {
  const root = document.getElementById('kernos-desktop-concept');
  const original = root.querySelector('.kd-classic');
  const designs = ['classic', 'clean', 'workbench', 'paper', 'retro', 'midnight'];
  const desktops = [original];
  designs.slice(1).forEach(name => {
    const desktop = original.cloneNode(true);
    desktop.classList.replace('kd-classic', 'kd-' + name);
    desktop.setAttribute('aria-label', name[0].toUpperCase() + name.slice(1) + ' desktop with Notepad and Console');
    if (name === 'workbench' || name === 'midnight') {
      const panel = document.createElement('header');
      panel.className = 'kd-top-panel';
      const brand = document.createElement('span');
      brand.textContent = 'KernOS / ' + (name === 'workbench' ? 'Workbench' : 'Desktop');
      const session = document.createElement('span');
      session.textContent = name === 'workbench' ? 'Workspace 1' : 'Local session';
      panel.append(brand, session); desktop.prepend(panel);
    }
    root.querySelector('.kd-' + name + '-mount').replaceWith(desktop);
    desktops.push(desktop);
  });
  const sourceSample = original.querySelector('.kd-source').value;
  desktops.forEach((desktop, variantIndex) => {
    const designKey = designs[variantIndex];
    const designLabel = designKey[0].toUpperCase() + designKey.slice(1);
    const editor = desktop.querySelector('[data-app="editor"]');
    const source = desktop.querySelector('.kd-source');
    const output = desktop.querySelector('.kd-output');
    const documents = {'hello.c':sourceSample, 'notes.txt':'My KernOS workspace\n\nWrite a program in Notepad.\nSave it, compile it in Console, and run it.\n'};
    let fileName = 'hello.c';
    let dirty = false;
    let z = 5;
    let saved = null;
    try { saved = window.openai?.widgetState?.privateContent?.[designKey]; } catch (_) {}
    if (saved && typeof saved.text === 'string') { source.value = saved.text; fileName = saved.fileName || fileName; dirty = !!saved.dirty; }
    const persist = () => {
      try {
        const old = window.openai?.widgetState || {};
        window.openai?.setWidgetState({modelContent:{desktopConcept:designLabel},privateContent:{[designKey]:{fileName,text:source.value.slice(0,4000),dirty}}})?.catch(() => {});
      } catch (_) {}
    };
    const refreshDocument = () => {
      desktop.querySelector('.kd-document-title').textContent = (dirty ? '* ' : '') + fileName + ' — Notepad';
      desktop.querySelector('.kd-path').textContent = 'My files / ' + fileName;
      desktop.querySelector('.kd-save-status').textContent = dirty ? 'Unsaved changes' : 'Saved';
      const before = source.value.slice(0, source.selectionStart);
      const lines = before.split('\n');
      desktop.querySelector('.kd-caret').textContent = 'Ln ' + lines.length + ', Col ' + (lines[lines.length-1].length+1);
    };
    const closeMenus = () => {
      desktop.querySelectorAll('.kd-menu').forEach(m => m.hidden = true);
      desktop.querySelectorAll('[data-menu]').forEach(b => b.setAttribute('aria-expanded','false'));
    };
    const focus = win => {
      desktop.querySelectorAll('.kd-window').forEach(w => w.classList.toggle('kd-active', w === win));
      desktop.querySelectorAll('[data-task]').forEach(b => b.classList.toggle('kd-task-active', b.dataset.task === win.dataset.app));
      win.style.zIndex = String(++z);
    };
    const open = app => {
      const win = desktop.querySelector('[data-app="'+app+'"]');
      win.hidden = false;
      desktop.querySelector('[data-task="'+app+'"]').hidden = false;
      desktop.querySelector('.kd-start-menu').hidden = true;
      desktop.querySelector('.kd-start').setAttribute('aria-expanded','false');
      closeMenus(); focus(win);
    };
    const save = () => { documents[fileName] = source.value; dirty = false; refreshDocument(); persist(); };
    source.addEventListener('input', () => { dirty = true; refreshDocument(); });
    source.addEventListener('click', refreshDocument);
    source.addEventListener('keyup', refreshDocument);
    source.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
      if (e.key === 'Tab') { e.preventDefault(); source.setRangeText('    ',source.selectionStart,source.selectionEnd,'end'); dirty = true; refreshDocument(); }
    });
    desktop.querySelectorAll('.kd-window').forEach(win => {
      win.addEventListener('pointerdown', () => focus(win));
      const bar = win.querySelector('.kd-titlebar');
      let drag = null;
      bar.addEventListener('pointerdown', e => {
        if (e.target.closest('button') || win.classList.contains('kd-maximized') || desktop.clientWidth <= 600) return;
        const wr = win.getBoundingClientRect(), dr = desktop.getBoundingClientRect();
        drag = {x:e.clientX,y:e.clientY,left:wr.left-dr.left,top:wr.top-dr.top};
        win.style.left = drag.left+'px'; win.style.top = drag.top+'px'; win.style.right = 'auto';
        bar.setPointerCapture(e.pointerId); e.preventDefault();
      });
      bar.addEventListener('pointermove', e => {
        if (!drag) return;
        win.style.left = Math.max(0,Math.min(desktop.clientWidth-win.offsetWidth,drag.left+e.clientX-drag.x))+'px';
        win.style.top = Math.max(0,Math.min(desktop.clientHeight-90,drag.top+e.clientY-drag.y))+'px';
      });
      bar.addEventListener('pointerup', () => drag = null);
      bar.addEventListener('pointercancel', () => drag = null);
      bar.addEventListener('dblclick', e => { if (!e.target.closest('button')) win.classList.toggle('kd-maximized'); });
    });
    desktop.addEventListener('click', e => {
      const button = e.target.closest('button');
      if (!button) { closeMenus(); return; }
      if (button.dataset.menu) {
        const popup = desktop.querySelector('[data-popup="'+button.dataset.menu+'"]');
        const show = popup.hidden; closeMenus(); popup.hidden = !show; button.setAttribute('aria-expanded',String(show)); return;
      }
      if (button.classList.contains('kd-start')) {
        const menu = desktop.querySelector('.kd-start-menu'); menu.hidden = !menu.hidden; button.setAttribute('aria-expanded',String(!menu.hidden)); closeMenus(); return;
      }
      if (button.dataset.open) { open(button.dataset.open); return; }
      if (button.dataset.task) {
        const win = desktop.querySelector('[data-app="'+button.dataset.task+'"]');
        if (!win.hidden && win.classList.contains('kd-active')) win.hidden = true; else open(button.dataset.task); return;
      }
      if (button.dataset.document) {
        if (dirty) save();
        fileName = button.dataset.document; source.value = documents[fileName] || ''; dirty = false;
        open('editor'); refreshDocument(); persist(); return;
      }
      if (button.dataset.action) {
        const win = button.closest('.kd-window');
        if (button.dataset.action === 'maximize') win.classList.toggle('kd-maximized');
        else { win.hidden = true; if (button.dataset.action === 'close') desktop.querySelector('[data-task="'+win.dataset.app+'"]').hidden = true; }
        closeMenus(); return;
      }
      const command = button.dataset.command;
      if (command === 'save') save();
      if (command === 'new') { if (dirty) save(); fileName = 'untitled.txt'; source.value = ''; dirty = true; refreshDocument(); }
      if (command === 'select') { source.focus(); source.select(); }
      if (command === 'insert') { source.setRangeText('Hello from KernOS!',source.selectionStart,source.selectionEnd,'end'); dirty = true; refreshDocument(); }
      if (command === 'wrap') source.wrap = source.wrap === 'off' ? 'soft' : 'off';
      if (command === 'large') source.style.fontSize = source.style.fontSize === '16px' ? '14px' : '16px';
      closeMenus();
    });
    desktop.querySelector('.kd-prompt').addEventListener('submit', e => {
      e.preventDefault();
      const input = e.target.querySelector('input'); const command = input.value.trim(); if (!command) return;
      let result = '';
      if (command === 'clear') output.textContent = '';
      else {
        if (command === 'help') result = 'Preview commands: ls, cc hello.c, run hello, clear';
        else if (command === 'ls') result = Object.keys(documents).join('    ');
        else if (/^cc\s+/i.test(command)) result = 'Design preview: sample build completed.\nCreated HELLO.ELF';
        else if (/^run\s+/i.test(command)) { const match = documents['hello.c'].match(/puts\("([^"\n]*)"\)/); result = (match ? match[1] : 'Hello from KernOS!')+'\nProcess exited with code 0.'; }
        else result = 'Sample console only. Type help for preview commands.';
        output.textContent += '\n> '+command+'\n'+result+'\n';
      }
      input.value = ''; desktop.querySelector('.kd-terminal-body').scrollTop = 100000;
    });
    refreshDocument();
    if (globalThis.Tweak) {
      const settings = {icons:true,largeText:false};
      const render = () => { desktop.querySelector('.kd-icons').hidden = !settings.icons; source.style.fontSize = settings.largeText ? '16px' : '14px'; };
      const tweak = new Tweak({container:desktop,onChange:render});
      tweak.addToggle(settings,'icons',{label:'Desktop icons'});
      tweak.addToggle(settings,'largeText',{label:'Larger editor text'});
    }
  });
  if (globalThis.lucide) lucide.createIcons();
})();
</script>
